<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Conectado</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #e0e0e0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .container { text-align: center; padding: 40px; }
        h1 { color: #ff0050; font-size: 2rem; margin-bottom: 20px; }
        p { color: #aaa; margin-bottom: 20px; }
        .spinner { border: 4px solid #333; border-top: 4px solid #ff0050; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>Conectando ao TikTok...</h1>
        <p>Aguarde, você será redirecionado.</p>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const state = params.get('state');
        if (code) {
            window.location.href = 'http://localhost:8000/api/auth/tiktok/callback?code=' + encodeURIComponent(code) + '&state=' + encodeURIComponent(state);
        } else {
            document.querySelector('h1').textContent = 'Erro';
            document.querySelector('p').textContent = 'Código não encontrado.';
            document.querySelector('.spinner').style.display = 'none';
        }
    </script>
</body>
</html>
